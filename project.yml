name: ExcitingCompressor
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  ExcitingCompressor:
    type: application
    platform: [iOS, macOS]
    sources: [App]
    dependencies:
      - target: ExcitingCompressorExtension_${platform}
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: ExcitingCompressor
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.ExcitingCompressor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Exciting Compressor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/App-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES

  ExcitingCompressorExtension:
    type: app-extension
    platform: [iOS, macOS]
    sources: [Extension]
    dependencies:
      - sdk: CoreAudioKit.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_NAME: ExcitingCompressorExtension
        PRODUCT_MODULE_NAME: ExcitingCompressorExtension
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.ExcitingCompressor.AUExtension
        INFOPLIST_FILE: Config/Extension-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Support/Extension-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/Extension-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        GCC_OPTIMIZATION_LEVEL[config=Release]: 3
